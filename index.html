<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Sales OS — Pitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #000000;
      --blue: #2563EB;
      --green: #16A34A;
      --red: #EF4444;
      --line: #E7E7E7;
    }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    .deck { width: 100vw; height: 100vh; background: #fff; cursor: pointer; user-select: none; }
    .slide { position: absolute; inset: 0; padding: clamp(48px, 6vw, 96px); display: flex; flex-direction: column; justify-content: center; opacity: 0; transition: opacity 200ms ease; pointer-events: none; }
    .slide.active { opacity: 1; pointer-events: auto; }
    .kicker { color: var(--blue); font-weight: 800; letter-spacing: -0.02em; }
    .title { font-size: clamp(54px, 5.9vw, 104px); line-height: .94; letter-spacing: -0.065em; font-weight: 900; }
    .title-md { font-size: clamp(44px, 4.2vw, 76px); line-height: 1; letter-spacing: -0.055em; font-weight: 900; }
    .body-lg { font-size: clamp(26px, 2.3vw, 44px); line-height: 1.12; letter-spacing: -0.035em; }
    .body-md { font-size: clamp(22px, 1.55vw, 30px); line-height: 1.22; letter-spacing: -0.025em; }
    .body-sm { font-size: clamp(17px, 1.05vw, 22px); line-height: 1.35; }
    .muted { color: var(--muted); }
    .blue { color: var(--blue); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .logo-main { width: min(520px, 44vw); height: auto; object-fit: contain; }
    .logo-final { width: min(420px, 30vw); height: auto; object-fit: contain; }
    .footer { position: absolute; left: clamp(48px, 6vw, 96px); right: clamp(48px, 6vw, 96px); bottom: 38px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 17px; }
    .counter { color: var(--muted); font-size: 16px; font-weight: 600; }
    .flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 26px; align-items: center; margin-top: 58px; }
    .flow-item { border: 2px solid var(--blue); border-radius: 24px; min-height: 145px; padding: 24px 18px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: clamp(20px, 1.38vw, 28px); font-weight: 800; line-height: 1.12; letter-spacing: -0.035em; position: relative; background: #fff; }
    .flow-item:not(:last-child)::after { content: '→'; position: absolute; right: -25px; top: 50%; transform: translateY(-50%); color: var(--blue); font-size: 34px; font-weight: 900; }
    .pill { border: 2px solid var(--blue); color: var(--blue); border-radius: 999px; padding: 13px 24px; font-size: clamp(19px, 1.15vw, 24px); font-weight: 800; }
    .table { width: min(1180px, 88vw); border-collapse: collapse; font-size: clamp(21px, 1.5vw, 30px); line-height: 1.1; overflow: hidden; border-radius: 24px; }
    .table th, .table td { border: 1px solid var(--line); padding: 24px 28px; text-align: center; }
    .table th:first-child, .table td:first-child { text-align: left; font-weight: 800; }
    .table th { font-weight: 900; }
    .atlas-col { background: rgba(37, 99, 235, 0.10); color: var(--blue); font-weight: 900; }
    .check, .xmark { font-size: 32px; font-weight: 900; }
    .check { color: var(--green); }
    .xmark { color: var(--red); }
    .photo { width: min(360px, 24vw); height: min(500px, 52vh); object-fit: cover; object-position: 50% 24%; border-radius: 34px; box-shadow: 0 28px 70px rgba(0,0,0,.14); }
    .client-logo { width: clamp(110px, 9vw, 160px); height: clamp(110px, 9vw, 160px); object-fit: contain; border-radius: 24px; background: #fff; box-shadow: 0 14px 42px rgba(0,0,0,.08); padding: 18px; }
    .icon-card { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .icon-card .emoji { font-size: clamp(58px, 4.7vw, 88px); line-height: 1; filter: none; }
    .icon-card .label { font-size: clamp(23px, 1.65vw, 32px); font-weight: 800; letter-spacing: -0.04em; }
    .platform-shot { width: 100%; height: min(485px, 50vh); object-fit: cover; object-position: left top; border-radius: 28px; border: 1px solid var(--line); box-shadow: 0 24px 70px rgba(0,0,0,.10); }
    .team-avatar { width: clamp(118px, 8.8vw, 162px); height: clamp(118px, 8.8vw, 162px); border-radius: 999px; object-fit: cover; object-position: 50% 22%; border: 5px solid #fff; box-shadow: 0 14px 42px rgba(0,0,0,.12); background: #F3F4F6; }
    .generic-avatar { width: clamp(118px, 8.8vw, 162px); height: clamp(118px, 8.8vw, 162px); border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #F3F4F6; border: 5px solid #fff; box-shadow: 0 14px 42px rgba(0,0,0,.12); }
    .partner-card { border: 1px solid var(--line); border-radius: 30px; padding: 30px; box-shadow: 0 18px 60px rgba(0,0,0,.07); background: #fff; }
    @media (max-width: 900px) {
      .slide { padding: 40px 26px; }
      .flow { grid-template-columns: 1fr; gap: 12px; margin-top: 28px; }
      .flow-item:not(:last-child)::after { display: none; }
      .footer { left: 26px; right: 26px; bottom: 22px; }
      .table th, .table td { padding: 14px 10px; }
    }
  </style>
</head>

    function App() {
      const [current, setCurrent] = React.useState(0);
      const total = slides.length;
      const next = React.useCallback(() => setCurrent(i => Math.min(total - 1, i + 1)), [total]);
      const prev = React.useCallback(() => setCurrent(i => Math.max(0, i - 1)), []);

      React.useEffect(() => {
        const onKey = (ev) => {
          if (ev.key === 'ArrowRight' || ev.key === ' ') next();
          if (ev.key === 'ArrowLeft') prev();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [next, prev]);

      const handleClick = () => next();
      return e('main', {className:'deck', onClick: handleClick},
        slides.map((S, i) => e(S, {key:i, active:i===current, index:i, total}))
      );
    }
